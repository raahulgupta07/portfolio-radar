# Local run: docker compose up --build
# Then load sample data once: docker compose exec mcp python -m app.adapter demo
# Open http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 3s
      retries: 20

  # City MCP Gateway: the only way to the data and the trackers.
  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
      MCP_ALLOWED_HOSTS: '["127.0.0.1:*","localhost:*","mcp:*"]'
      SECRET_STORE_PATH: /srv/secrets/dev-secrets.json
    ports: ["8000:8000"]
    volumes: [devsecrets:/srv/secrets]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  # Scheduled jobs (nightly sync, Radar). Reaches data only through the gateway.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
      GATEWAY_URL: http://mcp:8000
      SECRET_STORE_PATH: /srv/secrets/dev-secrets.json
    volumes: [devsecrets:/srv/secrets:ro]
    depends_on:
      mcp: {condition: service_healthy}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: web/.env.example
    environment:
      GATEWAY_URL: http://mcp:8000
      ORIGIN: http://localhost:3000
    ports: ["3000:3000"]
    depends_on:
      mcp: {condition: service_healthy}
    restart: unless-stopped

volumes:
  dbdata:
  # Dev only: secrets pasted in Admin. Production uses Azure Key Vault (SECRET_STORE=keyvault).
  devsecrets:
