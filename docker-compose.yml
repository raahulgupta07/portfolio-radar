# Local run: docker compose up
# Phase 1-2 services. `worker` (adapter, scheduler, Radar) and `web` (SvelteKit)
# are added in later phases.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 3s
      retries: 20

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://radar:radar@db:5432/radar
      MCP_ALLOWED_HOSTS: '["127.0.0.1:*","localhost:*","mcp:*"]'
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 5
    restart: unless-stopped

volumes:
  dbdata:
