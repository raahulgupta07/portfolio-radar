<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radar face</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}px; height: {{px}}px; display: inline-block; line-height: 0">
<svg viewBox="0 0 100 100" width="{{px}}" height="{{px}}" role="img" aria-label="Radar, {{label}}">
<g opacity="{{ping}}" fill="none" stroke="{{tip}}" stroke-width="3" stroke-linecap="round">
<path d="M38 12 A14 14 0 0 1 62 12"></path>
<path d="M31 9 A22 22 0 0 1 69 9"></path>
</g>
<line x1="50" y1="26" x2="50" y2="15" stroke="#111111" stroke-width="3.5" stroke-linecap="round"></line>
<circle cx="50" cy="13" r="5.5" fill="{{tip}}" stroke="#111111" stroke-width="2.5"></circle>
<rect x="11" y="25" width="78" height="68" rx="32" fill="{{body}}" stroke="#111111" stroke-width="3"></rect>
<circle cx="29" cy="68" r="6" fill="#F27E7E" opacity="{{cheeks}}"></circle>
<circle cx="71" cy="68" r="6" fill="#F27E7E" opacity="{{cheeks}}"></circle>
<path d="{{brow}}" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round"></path>
<path d="{{eyeL}}" fill="none" stroke="#111111" stroke-width="{{ew}}" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{eyeR}}" fill="none" stroke="#111111" stroke-width="{{ew}}" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="{{mouth}}" fill="none" stroke="#111111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
<g opacity="{{badgeOp}}">
<circle cx="84" cy="24" r="13" fill="{{badgeBg}}" stroke="#111111" stroke-width="2.5"></circle>
<text x="84" y="29.5" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="{{badgeInk}}">{{badge}}</text>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["ready","resting","scanning","thinking","alert","asking","happy","listening","offline"],"default":"ready"},"size":{"editor":"int","default":200,"min":16,"max":400},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const mood = this.props.mood ?? 'ready';
    const px = this.props.size ?? 200;
    const mint = '#7FD69A';
    const dot = (x, y) => 'M' + x + ' ' + y + ' l0.01 0';
    const M = {
      ready:     { label: 'ready', body: mint, tip: mint, ping: 0, ew: 8, eyeL: dot(38, 54), eyeR: dot(62, 54), mouth: 'M44 70 Q50 75 56 70', brow: '', cheeks: 0, badge: '' },
      resting:   { label: 'resting', body: '#A9DDB8', tip: '#9AA59D', ping: 0, ew: 4, eyeL: 'M32 56 Q38 60 44 56', eyeR: 'M56 56 Q62 60 68 56', mouth: 'M47 71 H53', brow: '', cheeks: 0, badge: 'z', badgeBg: '#FFFFFF', badgeInk: '#111111' },
      scanning:  { label: 'scanning projects', body: mint, tip: mint, ping: 1, ew: 8, eyeL: dot(43, 53), eyeR: dot(67, 53), mouth: 'M45 71 Q50 73 55 71', brow: '', cheeks: 0, badge: '' },
      thinking:  { label: 'thinking', body: mint, tip: mint, ping: 0.45, ew: 8, eyeL: dot(34, 50), eyeR: dot(58, 50), mouth: 'M46 71 H54', brow: 'M53 41 L64 38', cheeks: 0, badge: '…', badgeBg: '#FFFFFF', badgeInk: '#111111' },
      alert:     { label: 'found a problem', body: mint, tip: '#D64545', ping: 1, ew: 11, eyeL: dot(38, 53), eyeR: dot(62, 53), mouth: 'M50 66 a4 4 0 1 0 0.01 0', brow: 'M31 42 L44 44 M56 44 L69 42', cheeks: 0, badge: '!', badgeBg: '#D64545', badgeInk: '#FFFFFF' },
      asking:    { label: 'waiting for you', body: mint, tip: '#F2C14E', ping: 0, ew: 8, eyeL: dot(38, 51), eyeR: dot(62, 51), mouth: 'M45 71 Q50 69 55 71', brow: 'M56 40 L68 36', cheeks: 0, badge: '?', badgeBg: '#F2C14E', badgeInk: '#111111' },
      happy:     { label: 'happy, all done', body: mint, tip: mint, ping: 0, ew: 4.5, eyeL: 'M32 56 Q38 47 44 56', eyeR: 'M56 56 Q62 47 68 56', mouth: 'M41 66 Q50 78 59 66', brow: '', cheeks: 0.8, badge: '' },
      listening: { label: 'listening', body: mint, tip: mint, ping: 1, ew: 4, eyeL: 'M32 54 Q38 59 44 54', eyeR: 'M56 54 Q62 59 68 54', mouth: 'M45 70 Q50 74 55 70', brow: '', cheeks: 0.5, badge: '' },
      offline:   { label: 'cannot reach a source', body: '#C9D3CC', tip: '#9AA59D', ping: 0, ew: 7, eyeL: dot(38, 57), eyeR: dot(62, 57), mouth: 'M42 74 Q50 66 58 74', brow: 'M31 45 L43 49 M57 49 L69 45', cheeks: 0, badge: '!', badgeBg: '#9AA59D', badgeInk: '#FFFFFF' }
    };
    const f = M[mood] || M.ready;
    return { ...f, px, badgeOp: f.badge ? 1 : 0, badgeBg: f.badgeBg || '#FFFFFF', badgeInk: f.badgeInk || '#111111', brow: f.brow || 'M0 0' };
  }
}
</script>
</body>
</html>
